name: tab_writer
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2
  bloc: ^9.2.0
  go_router: ^17.0.1
  drift: ^2.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: LexendGiga
      fonts:
        - asset: assets/fonts/LexendGiga-Regular.ttf
          weight: 400
        - asset: assets/fonts/LexendGiga-Light.ttf
          weight: 300
        - asset: assets/fonts/LexendGiga-Medium.ttf
          weight: 500
        - asset: assets/fonts/LexendGiga-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LexendGiga-Bold.ttf
          weight: 700
        - asset: assets/fonts/LexendGiga-Black.ttf
          weight: 900