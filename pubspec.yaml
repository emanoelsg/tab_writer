name: tab_writer
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2
  bloc: ^9.2.0
  go_router: ^17.0.1
  drift: ^2.30.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  drift: ^2.30.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000" 
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: LexendGiga
      fonts:
        - asset: assets/fonts/static/LexendGiga-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/LexendGiga-Light.ttf
          weight: 300
        - asset: assets/fonts/static/LexendGiga-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/LexendGiga-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/LexendGiga-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/LexendGiga-Black.ttf
          weight: 900 